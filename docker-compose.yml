services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: ${MONGODB_URL}
    depends_on:
      mongodb:
        condition: service_healthy
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
